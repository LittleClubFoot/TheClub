# =============================================================================
# Mosquitto MQTT Broker — The Club Home Security
# =============================================================================
#
# Bridges communication between Frigate, Home Assistant, and Zigbee2MQTT.
#
# To add password authentication:
#   docker exec mosquitto mosquitto_passwd -c /mosquitto/config/mosquitto.passwd <username>
#   Then uncomment the password_file line below.
# =============================================================================

# Listener on default MQTT port
listener 1883

# Allow anonymous connections (for initial setup)
# IMPORTANT: Set to false and configure password_file for production
allow_anonymous true

# Uncomment for password-based authentication:
# allow_anonymous false
# password_file /mosquitto/config/mosquitto.passwd

# Persistence — retain messages across restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
