# ============================================================================
# The Club Dashboard - Woodpecker CI Pipeline
# ============================================================================
#
# This pipeline runs on every push and pull request via Woodpecker CI.
# It builds, tests, and validates the Go application.
#
# ============================================================================

when:
  - event: [push, pull_request]

steps:
  # Build the Go application
  - name: build
    image: golang:1.21-alpine
    commands:
      - go mod download
      - go build -ldflags="-s -w" -o bin/theclub-server ./cmd/webserver

  # Run tests with coverage
  - name: test
    image: golang:1.21-alpine
    commands:
      - go test -v -race -coverprofile=coverage.out ./...

  # Run Go vet for static analysis
  - name: vet
    image: golang:1.21-alpine
    commands:
      - go vet ./...

  # Check formatting
  - name: fmt-check
    image: golang:1.21-alpine
    commands:
      - test -z "$(gofmt -l .)"
