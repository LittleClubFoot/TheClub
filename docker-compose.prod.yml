services:
  # Caddy reverse proxy with SSL
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs:/var/log/caddy
    networks:
      - club-network
    restart: unless-stopped
    depends_on:
      - homer
      - go-test-server
      - gitea
      - woodpecker-server
    # Security options
    security_opt:
      - no-new-privileges:true

  # Homer dashboard (homepage)
  homer:
    image: b4bz/homer:latest
    volumes:
      - ./assets:/www/assets:ro
    environment:
      - INIT_ASSETS=0
    networks:
      - club-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Gitea - Self-hosted Git service
  gitea:
    image: gitea/gitea:latest
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-https://localhost/gitea/}
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-localhost}
      - GITEA__server__SSH_DOMAIN=${GITEA_SSH_DOMAIN:-localhost}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__security__INSTALL_LOCK=true
    ports:
      - "2222:22"
    volumes:
      - gitea_data:/data
      - gitea_config:/etc/gitea
    networks:
      - club-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/gitea/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Woodpecker CI Server
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    environment:
      - WOODPECKER_HOST=${WOODPECKER_HOST:-https://localhost/ci}
      - WOODPECKER_OPEN=false
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN:-theclub}
      - WOODPECKER_GITEA=true
      - WOODPECKER_GITEA_URL=http://gitea:3000
      - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT}
      - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    networks:
      - club-network
    depends_on:
      - gitea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Woodpecker CI Agent
  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_MAX_WORKFLOWS=2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - club-network
    depends_on:
      - woodpecker-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'

  # NOTE: File services provided by separate NAS deployment
  # Configure your NAS services and update Caddy routing accordingly

  # Go test server
  go-test-server:
    build:
      context: .
      target: production
    volumes:
      - ./templates:/root/templates:ro
    networks:
      - club-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  club-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  gitea_data:
  gitea_config:
  woodpecker_data: