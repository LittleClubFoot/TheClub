# ============================================================================
# Unbound Configuration - Private Recursive DNS Resolver
# ============================================================================
# Privacy-focused DNS configuration
# Queries DNS root servers directly (no Google, Cloudflare, or ISP logging)
# ============================================================================

server:
    # Network configuration
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Access control
    access-control: 0.0.0.0/0 allow
    access-control: ::0/0 allow

    # Privacy settings
    # Hide version information
    hide-identity: yes
    hide-version: yes
    hide-trustanchor: yes

    # Prevent DNS rebinding attacks
    private-address: 192.168.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: 127.0.0.0/8
    private-address: ::ffff:0:0/96

    # Performance tuning
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Cache sizes
    rrset-cache-size: 128m
    msg-cache-size: 64m
    key-cache-size: 32m
    neg-cache-size: 4m

    # Cache times
    cache-min-ttl: 300
    cache-max-ttl: 86400
    cache-max-negative-ttl: 3600

    # Prefetch popular domains for faster resolution
    prefetch: yes
    prefetch-key: yes

    # Reduce latency
    serve-expired: yes
    serve-expired-ttl: 86400

    # Security
    # Enable DNSSEC validation
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"
    val-clean-additional: yes
    val-permissive-mode: no
    aggressive-nsec: yes

    # Privacy: Don't send queries with EDNS client subnet
    # This prevents your IP from being sent to authoritative servers
    send-client-subnet: 0.0.0.0/0
    client-subnet-always-forward: no
    max-client-subnet-ipv4: 0

    # Logging (set to 0 for no logging, or 1-5 for increasing verbosity)
    verbosity: 1
    log-queries: no  # Privacy: Don't log queries
    log-replies: no  # Privacy: Don't log replies
    log-local-actions: no
    log-servfail: no

    # Performance
    so-rcvbuf: 4m
    so-sndbuf: 4m
    so-reuseport: yes

    # Hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    qname-minimisation: yes  # Privacy: Only send minimum necessary info
    qname-minimisation-strict: no

    # Unwanted replies
    unwanted-reply-threshold: 10000
    do-not-query-localhost: no

    # Local zones (for private network)
    local-zone: "lan." static
    local-zone: "home." static

# ============================================================================
# Root Hints
# ============================================================================
# Download with: wget https://www.internic.net/domain/named.root -O root.hints
# Optional: Unbound has root hints built-in, but you can override

# root-hints: "/opt/unbound/etc/unbound/root.hints"

# ============================================================================
# Forward Zones (Optional - Use ONLY if recursive queries don't work)
# ============================================================================
# Uncomment ONLY if you have firewall issues preventing recursive queries
# This forwards to Cloudflare but reduces privacy benefits

# forward-zone:
#     name: "."
#     forward-tls-upstream: yes
#     forward-addr: 1.1.1.1@853#cloudflare-dns.com
#     forward-addr: 1.0.0.1@853#cloudflare-dns.com

# ============================================================================
# Privacy Notes
# ============================================================================
#
# This configuration maximizes privacy by:
# 1. Querying root servers directly (no third-party DNS providers)
# 2. QNAME minimization (sends only necessary information)
# 3. No query logging
# 4. No client subnet information sent to authoritative servers
# 5. Prefetching and caching to reduce external queries
#
# Trade-offs:
# - First query to a domain is slower (recursive resolution)
# - Subsequent queries are fast (cached)
# - Requires port 53 to be open for recursive queries (most networks allow this)
#
# Privacy vs. Performance:
# - For maximum privacy: Keep this configuration
# - If recursive queries don't work: Uncomment forward-zone section
#   (forwards to Cloudflare DNS-over-TLS, still better than plain DNS)
#
# ============================================================================
