# ============================================================================
# The Club - Monitoring Stack (Phase 1)
# ============================================================================
# Uptime Kuma for status monitoring and health checks
#
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Access at: https://localhost/status (after Caddyfile update)
# ============================================================================

version: '3.8'

services:
  # Uptime Kuma - Beautiful status page and monitoring
  # Community favorite for service health monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - club-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  club-network:
    external: true
    name: theclub_club-network

volumes:
  uptime-kuma-data:
    name: uptime-kuma-data
